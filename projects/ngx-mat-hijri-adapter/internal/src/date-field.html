<mat-form-field subscriptSizing="dynamic">
  @if (label()) {
    <mat-label>{{ label() }}</mat-label>
  }

  <input
    matInput
    [formControl]="input"
    [matDatepicker]="picker"
    [min]="pickerMin()"
    [max]="pickerMax()"
    [matDatepickerFilter]="filter()"
    [placeholder]="placeholder()"
    [errorStateMatcher]="errorState"
    (blur)="markTouched()"
  />

  @if (toggleMode()) {
    <span matIconSuffix class="date-field-calendars">
      @if (calendarToggleTemplate(); as calendarToggle) {
        <ng-container
          [ngTemplateOutlet]="calendarToggle"
          [ngTemplateOutletContext]="{ $implicit: toggleController() }"
        />
      } @else {
        <button
          type="button"
          mat-icon-button
          [disabled]="disabled()"
          [attr.aria-pressed]="display() === calendarCode.umalqura"
          [attr.aria-label]="labels().hijriAriaLabel"
          (click)="openIn(calendarCode.umalqura, picker)"
        >
          <mat-icon aria-hidden="true">dark_mode</mat-icon>
        </button>
        <button
          type="button"
          mat-icon-button
          [disabled]="disabled()"
          [attr.aria-pressed]="display() === calendarCode.gregorian"
          [attr.aria-label]="labels().gregorianAriaLabel"
          (click)="openIn(calendarCode.gregorian, picker)"
        >
          <mat-icon aria-hidden="true">add_circle_outline</mat-icon>
        </button>
      }
    </span>
  } @else {
    <mat-datepicker-toggle matIconSuffix [for]="picker" />
  }

  <mat-datepicker #picker [touchUi]="touchUi()" (closed)="markTouched()" />

  @if (equivalent()) {
    <mat-hint>{{ equivalent() }}</mat-hint>
  }

  @if (errorMessage()) {
    <mat-error>{{ errorMessage() }}</mat-error>
  }
</mat-form-field>
