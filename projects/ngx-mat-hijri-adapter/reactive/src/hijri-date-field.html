<mat-form-field subscriptSizing="dynamic">
  @if (label()) {
    <mat-label>{{ label() }}</mat-label>
  }

  <input
    matInput
    [formControl]="input"
    [matDatepicker]="picker"
    [min]="pickerMin()"
    [max]="pickerMax()"
    [matDatepickerFilter]="filter()"
    [placeholder]="placeholder()"
    [errorStateMatcher]="errorState"
    (blur)="touch()"
  />

  @if (calendarToggle()) {
    <span matIconSuffix class="hijri-field-calendars">
      <button
        type="button"
        mat-icon-button
        [disabled]="disabled()"
        [attr.aria-pressed]="display() === 'islamic-umalqura'"
        [attr.aria-label]="labels().hijriAriaLabel"
        (click)="openIn('islamic-umalqura', picker)"
      >
        {{ labels().hijri }}
      </button>
      <button
        type="button"
        mat-icon-button
        [disabled]="disabled()"
        [attr.aria-pressed]="display() === 'gregorian'"
        [attr.aria-label]="labels().gregorianAriaLabel"
        (click)="openIn('gregorian', picker)"
      >
        {{ labels().gregorian }}
      </button>
    </span>
  } @else {
    <mat-datepicker-toggle matIconSuffix [for]="picker" />
  }

  <mat-datepicker #picker [touchUi]="touchUi()" (closed)="touch()" />

  @if (equivalent()) {
    <mat-hint>{{ equivalent() }}</mat-hint>
  }

  @if (errorMessage()) {
    <mat-error>{{ errorMessage() }}</mat-error>
  }
</mat-form-field>
