<section
  class="grid grid-cols-1 gap-4 px-6 pt-5 pb-6 *:w-full"
  data-demo="reactive"
  [attr.lang]="locale()"
  [dir]="direction()"
  [formGroup]="form"
>
  <demo-controls [(locale)]="locale" [(direction)]="direction" />

  <ngx-mat-reactive-date-field
    formControlName="appointment"
    valueCalendar="islamic-umalqura"
    calendarToggle
    [label]="text().date"
    [locale]="locale()"
    [dateFilter]="notFriday"
    [errors]="text().errors"
  />
  <output
    class="-mt-1 block rounded-[10px] bg-surface-container-high px-3 py-2 font-mono text-body-small text-on-surface-variant"
    dir="ltr"
    data-value="appointment"
    >{{ appointmentValue() }}</output
  >

  <ngx-mat-reactive-date-range-field
    formControlName="stay"
    valueCalendar="gregorian"
    calendarToggle
    [label]="text().range"
    [startPlaceholder]="text().start"
    [endPlaceholder]="text().end"
    [locale]="locale()"
    [errors]="text().errors"
  />
  <output
    class="-mt-1 block rounded-[10px] bg-surface-container-high px-3 py-2 font-mono text-body-small text-on-surface-variant"
    dir="ltr"
    data-value="stay"
    >{{ stayValue() }}</output
  >
</section>
