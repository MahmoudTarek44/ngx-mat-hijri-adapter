<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="container topbar-inner">
    <a class="wordmark" routerLink="/">ngx-mat-<strong>hijri</strong>-adapter</a>
    <span class="version-chip" data-version>{{ version }}</span>

    <nav aria-label="Main">
      <a mat-button routerLink="/" fragment="playground">Playground</a>
      <a mat-button routerLink="/" fragment="examples">Examples</a>
    </nav>

    <span class="spacer"></span>

    <a mat-icon-button matTooltip="GitHub" aria-label="GitHub repository" [href]="repositoryUrl">
      <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"
        />
      </svg>
    </a>
    <button
      type="button"
      mat-icon-button
      matTooltip="Theme"
      aria-label="Choose color theme"
      data-theme-menu
      [matMenuTriggerFor]="themeMenu"
    >
      <mat-icon>{{ themeIcons[theme.mode()] }}</mat-icon>
    </button>
    <mat-menu #themeMenu="matMenu">
      @for (mode of themeModes; track mode) {
        <button
          type="button"
          mat-menu-item
          [attr.aria-checked]="theme.mode() === mode"
          role="menuitemradio"
          (click)="theme.mode.set(mode)"
        >
          <mat-icon>{{ themeIcons[mode] }}</mat-icon>
          <span>{{ mode === 'system' ? 'System' : mode === 'light' ? 'Light' : 'Dark' }}</span>
        </button>
      }
    </mat-menu>
  </div>
</header>

<main id="main">
  <router-outlet />
</main>

<footer class="footer">
  <div class="container">
    <p>ngx-mat-hijri-adapter {{ version }}, released under the MIT license.</p>
    <p>
      <a [href]="repositoryUrl">GitHub</a> ·
      <a [href]="repositoryUrl + '/blob/main/CHANGELOG.md'">Changelog</a>
    </p>
  </div>
</footer>
