<section data-demo="signals" [attr.lang]="locale()" [dir]="direction()">
  <h2>{{ text().title }}</h2>
  <div class="controls">
    <button
      type="button"
      data-locale="ar-SA"
      [attr.aria-pressed]="locale() === 'ar-SA'"
      (click)="useLocale('ar-SA')"
    >
      العربية
    </button>
    <button
      type="button"
      data-locale="en-US"
      [attr.aria-pressed]="locale() === 'en-US'"
      (click)="useLocale('en-US')"
    >
      English
    </button>
    <button
      type="button"
      data-direction="rtl"
      [attr.aria-pressed]="direction() === 'rtl'"
      (click)="useDirection('rtl')"
    >
      RTL
    </button>
    <button
      type="button"
      data-direction="ltr"
      [attr.aria-pressed]="direction() === 'ltr'"
      (click)="useDirection('ltr')"
    >
      LTR
    </button>
  </div>

  <ngx-mat-signal-date-field
    [formField]="form.appointment"
    valueCalendar="islamic-umalqura"
    calendarToggle
    [label]="text().date"
    [locale]="locale()"
    [dateFilter]="notFriday"
    [errorMessages]="text().errors"
  />
  <p data-value="appointment">{{ appointmentValue() }}</p>

  <ngx-mat-signal-date-range-field
    [formField]="form.stay"
    valueCalendar="gregorian"
    calendarToggle
    [label]="text().range"
    [startPlaceholder]="text().start"
    [endPlaceholder]="text().end"
    [locale]="locale()"
    [errorMessages]="text().errors"
  />
  <p data-value="stay">{{ stayValue() }}</p>
</section>
