<section [attr.data-calendar]="calendar" [attr.lang]="locale()" [dir]="direction()">
  <h2>{{ calendarTitle() }}</h2>
  <div class="controls">
    <button
      type="button"
      data-locale="ar-SA"
      [attr.aria-pressed]="locale() === 'ar-SA'"
      (click)="useLocale('ar-SA')"
    >
      العربية
    </button>
    <button
      type="button"
      data-locale="en-US"
      [attr.aria-pressed]="locale() === 'en-US'"
      (click)="useLocale('en-US')"
    >
      English
    </button>
    <button
      type="button"
      data-direction="rtl"
      [attr.aria-pressed]="direction() === 'rtl'"
      (click)="useDirection('rtl')"
    >
      RTL
    </button>
    <button
      type="button"
      data-direction="ltr"
      [attr.aria-pressed]="direction() === 'ltr'"
      (click)="useDirection('ltr')"
    >
      LTR
    </button>
  </div>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>{{ fieldLabel() }}</mat-label>
    <input
      matInput
      [matDatepicker]="picker"
      [formControl]="date"
      [min]="min"
      [max]="max"
      [matDatepickerFilter]="disableFridays"
    />
    <mat-datepicker-toggle matIconSuffix [for]="picker" />
    <mat-datepicker #picker />
    <mat-hint>{{ hint() }}</mat-hint>
    @if (date.invalid) {
      <mat-error>{{ error() }}</mat-error>
    }
  </mat-form-field>

  <p data-equivalent>{{ equivalent() }}</p>
</section>
